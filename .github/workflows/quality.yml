name: VS-08 quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Build-toolchain alignment: the pinned maplibre_gl 0.26.2 compiles its
      # own Android sources with Java 21 (`android/build.gradle` sets
      # sourceCompatibility/targetCompatibility 21), and the signed release
      # artifacts are built with a JDK 21 toolchain. Pinning the runner to 17
      # made `:maplibre_gl:compileDebugJavaWithJavac` fail with "invalid source
      # release: 21" — a failure that stayed hidden only because the test step
      # always failed first and this step was never reached.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.7
          cache: true

      - name: Install Android API 36
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "platforms;android-36"
          "build-tools;36.0.0"

      - name: Resolve locked dependencies
        run: flutter pub get

      - name: Verify approved authority and slice boundary
        run: dart run tool/verify_authority.dart

      # M7 re-scope (2026-09-16): formatting is enforced PROSPECTIVELY, on the
      # Dart files this push/PR actually changes. The repository carries a
      # systemic, pre-existing style divergence (236 of 604 Dart files, 170 of
      # which predate the M1-M6 program), so demanding a whole-tree reformat
      # would rewrite accepted, already-reviewed code wholesale and destroy
      # review and audit signal. Per-file enforcement on the current change set
      # keeps the gate meaningful without a mass rewrite.
      #
      # Coverage law (2026-09-20): `root/**/*.dart` requires at least one
      # directory below the root, so it selected nothing at the root itself.
      # That silently excluded lib/main.dart and test/flutter_test_config.dart,
      # and it excluded the ENTIRE integration_test/ and tool/ trees, neither of
      # which contains any nested Dart file (only 705 of the 721 tracked Dart
      # files under these four roots were selectable at all). Each root now
      # lists both a root-level and a nested pattern, so every Dart file under
      # these roots is selectable under either wildcard reading.
      # Trigger scope (2026-09-21): the coverage law above decides WHICH files
      # are eligible, but the comparison anchor decides HOW MANY commits are
      # inspected. `workflow_dispatch` carries no `github.event.before`, so the
      # old fallback to `HEAD^` inspected only the TIP commit: on a multi-commit
      # branch every earlier commit escaped formatting enforcement (proven with
      # a two-commit probe: dispatch selected 1 of 2 changed Dart files). Worse,
      # when no anchor was derivable at all the check printed "nothing to
      # reformat" and exited 0 - a vacuous green. The anchor is now derived per
      # event and the step FAILS CLOSED on an unresolvable range instead of
      # silently passing. Event data is passed through the environment rather
      # than interpolated into the shell.
      - name: Verify formatting of changed Dart files
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          zero_sha="0000000000000000000000000000000000000000"
          base=""
          base_source=""

          # The anchor differs per event:
          #   pull_request -> the PR base SHA: the PR's full change range.
          #   push         -> github.event.before: the full pushed range.
          #   dispatch     -> no event anchor exists; derived from main below.
          if [[ "$EVENT_NAME" == "pull_request" && -n "$PR_BASE_SHA" ]] \
            && git cat-file -e "${PR_BASE_SHA}^{commit}" 2>/dev/null; then
            base="$PR_BASE_SHA"
            base_source="pull_request.base.sha"
          elif [[ -n "$EVENT_BEFORE" && "$EVENT_BEFORE" != "$zero_sha" ]] \
            && git cat-file -e "${EVENT_BEFORE}^{commit}" 2>/dev/null; then
            base="$EVENT_BEFORE"
            base_source="github.event.before"
          fi

          # A manual dispatch has no `before`, and the first push of a new branch
          # reports the zero SHA for it. Anchor those to canonical main so the
          # WHOLE branch range is inspected instead of just the tip commit.
          if [[ -z "$base" ]] \
            && git rev-parse -q --verify origin/main >/dev/null; then
            base="$(git merge-base origin/main HEAD 2>/dev/null || true)"
            base_source="merge-base origin/main HEAD"
          fi

          if [[ -z "$base" ]]; then
            echo "::error::No trustworthy comparison base for event" \
              "'${EVENT_NAME}' (before='${EVENT_BEFORE:-<empty>}'," \
              "pr_base='${PR_BASE_SHA:-<empty>}'); refusing to verify an" \
              "unknown range."
            exit 1
          fi

          comparison="$(git merge-base "$base" HEAD 2>/dev/null || true)"
          if [[ -z "$comparison" ]]; then
            echo "::error::No merge base between '${base}' (${base_source})" \
              "and HEAD; refusing to verify an unknown range."
            exit 1
          fi

          echo "Formatting scope (${base_source}): ${comparison}..HEAD"

          changed=()
          while IFS= read -r file; do
            [[ -n "$file" ]] && changed+=("$file")
          done < <(git diff --name-only --diff-filter=ACMRT \
            "$comparison" HEAD -- \
            'lib/*.dart' 'lib/**/*.dart' \
            'test/*.dart' 'test/**/*.dart' \
            'integration_test/*.dart' 'integration_test/**/*.dart' \
            'tool/*.dart' 'tool/**/*.dart')

          if [[ ${#changed[@]} -eq 0 ]]; then
            echo "No changed Dart files under lib/, test/, integration_test/ or" \
              "tool/ in ${comparison}..HEAD - nothing to reformat."
            exit 0
          fi

          echo "Checking formatting for ${#changed[@]} changed Dart file(s):"
          printf '  %s\n' "${changed[@]}"
          dart format --output=none --set-exit-if-changed "${changed[@]}"

      - name: Static analysis
        run: flutter analyze

      - name: Verify generated source is clean
        run: |
          dart run build_runner build
          git diff --exit-code -- lib/core/database/app_database.g.dart

      - name: Dependency resolution report
        run: |
          flutter pub deps --style=compact
          flutter pub outdated --no-dev-dependencies

      - name: VS-01 through VS-08 unit, repository, migration, and widget tests
        run: flutter test

      - name: Verify test integrity (skip registry + discovery floor)
        run: >-
          flutter test test/integrity/test_integrity_gate_test.dart

      - name: Build debug APK
        run: >-
          flutter build apk --debug
          --dart-define-from-file=tool/env/production.json.example

      # M-6 inverted negative control. The ordinary debug APK deliberately
      # packages the tracked placeholder Maps key (`DEFAULT_API_KEY`), so the
      # Maps artifact verifier MUST fail here. This step fails CI if the
      # verifier unexpectedly accepts the artifact, if it fails in an unexpected
      # way, or if the expected sanitized placeholder classification is absent.
      # It never prints a raw manifest dump and needs no real Maps secret.
      - name: Verify Maps key gate rejects the placeholder artifact
        run: |
          set +e
          output="$(dart run tool/verify_maps_key.dart \
            --apk build/app/outputs/flutter-apk/app-debug.apk 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "::error::the Maps verifier accepted the placeholder debug artifact"
            exit 1
          fi
          if [ "$status" -ne 1 ]; then
            echo "::error::the Maps verifier failed unexpectedly (exit $status)"
            exit 1
          fi
          if ! printf '%s\n' "$output" | grep -q 'packages the placeholder Maps key'; then
            echo "::error::the expected sanitized Maps placeholder classification was absent"
            exit 1
          fi
          echo "Maps gate correctly rejected the placeholder artifact (exit $status)."

      - name: Verify merged Android artifact against the accepted baseline
        run: >-
          dart run tool/verify_merged_artifact.dart
          --apk build/app/outputs/flutter-apk/app-debug.apk

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
