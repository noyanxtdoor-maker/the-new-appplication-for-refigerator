name: VS-08 quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.7
          cache: true

      - name: Install Android API 36
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "platforms;android-36"
          "build-tools;36.0.0"

      - name: Resolve locked dependencies
        run: flutter pub get

      - name: Verify approved authority and slice boundary
        run: dart run tool/verify_authority.dart

      # M7 re-scope (2026-09-16): formatting is enforced PROSPECTIVELY, on the
      # Dart files this push/PR actually changes. The repository carries a
      # systemic, pre-existing style divergence (236 of 604 Dart files, 170 of
      # which predate the M1-M6 program), so demanding a whole-tree reformat
      # would rewrite accepted, already-reviewed code wholesale and destroy
      # review and audit signal. Per-file enforcement on the current change set
      # keeps the gate meaningful without a mass rewrite.
      - name: Verify formatting of changed Dart files
        shell: bash
        run: |
          set -euo pipefail

          before="${{ github.event.before }}"
          zero_sha="0000000000000000000000000000000000000000"

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif [[ -n "$before" && "$before" != "$zero_sha" ]] \
            && git cat-file -e "${before}^{commit}" 2>/dev/null; then
            base="$before"
          elif git rev-parse -q --verify HEAD^ >/dev/null; then
            # workflow_dispatch, and a branch pushed for the first time: compare
            # against the local parent so the check stays truthful.
            base="HEAD^"
          else
            base=""
          fi

          comparison=""
          if [[ -n "$base" ]]; then
            comparison="$(git merge-base "$base" HEAD 2>/dev/null || echo "$base")"
          fi

          changed=()
          if [[ -n "$comparison" ]]; then
            while IFS= read -r file; do
              [[ -n "$file" ]] && changed+=("$file")
            done < <(git diff --name-only --diff-filter=ACMRT \
              "$comparison" HEAD -- \
              'lib/**/*.dart' 'test/**/*.dart' \
              'integration_test/**/*.dart' 'tool/**/*.dart')
          fi

          if [[ ${#changed[@]} -eq 0 ]]; then
            echo "No changed Dart files under lib/, test/, integration_test/ or" \
              "tool/ in this change set - nothing to reformat."
            exit 0
          fi

          echo "Checking formatting for ${#changed[@]} changed Dart file(s):"
          printf '  %s\n' "${changed[@]}"
          dart format --output=none --set-exit-if-changed "${changed[@]}"

      - name: Static analysis
        run: flutter analyze

      - name: Verify generated source is clean
        run: |
          dart run build_runner build
          git diff --exit-code -- lib/core/database/app_database.g.dart

      - name: Dependency resolution report
        run: |
          flutter pub deps --style=compact
          flutter pub outdated --no-dev-dependencies

      - name: VS-01 through VS-08 unit, repository, migration, and widget tests
        run: flutter test

      - name: Build debug APK
        run: >-
          flutter build apk --debug
          --dart-define-from-file=tool/env/production.json.example

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
