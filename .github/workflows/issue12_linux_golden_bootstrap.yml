# TEMPORARY — issue #12 Linux golden baseline bootstrap.
#
# Purpose: rasterise the platform-scoped Linux golden baselines in the SAME
# environment that runs the required `quality` check, so the committed images
# are produced by the renderer that will later compare against them. Goldens
# generated on Windows do not match Linux rasterisation, which is the defect
# this change fixes.
#
# This workflow is scoped to a single maintenance branch, holds read-only
# permissions, never commits and never touches main. It is DELETED before the
# pull request for issue #12 is opened, so the normal `quality` workflow never
# gains an `--update-goldens` path.
name: issue12 linux golden bootstrap

on:
  push:
    branches: [fix/ci-platform-stability-issue12-20260920]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.7
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get

      # Rasterise every platform-scoped golden suite with the Linux renderer.
      # `--update-goldens` is used ONLY here; the normal quality workflow keeps
      # performing pure comparisons.
      - name: Generate Linux golden baselines
        run: >
          flutter test --update-goldens
          test/features/startup/presentation/goldens/home_pack1_golden_test.dart
          test/features/startup/presentation/goldens/home_skeleton_golden_test.dart
          test/features/goals/presentation/goldens/goal_icon_d1_golden_test.dart
          test/features/planner/presentation/backup_event_accent_test.dart

      - name: Show generated Linux baselines
        run: |
          set -euo pipefail
          find test -path '*goldens/linux/*' -name '*.png' | sort
          echo "generated: $(find test -path '*goldens/linux/*' -name '*.png' | wc -l)"

      - name: Package Linux baselines
        run: |
          set -euo pipefail
          tar -czf issue12-linux-goldens.tgz \
            test/features/startup/presentation/goldens/goldens/linux \
            test/features/goals/presentation/goldens/goldens/linux \
            test/features/planner/presentation/goldens/linux
          tar -tzf issue12-linux-goldens.tgz | sort
          sha256sum issue12-linux-goldens.tgz | tee issue12-linux-goldens.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: issue12-linux-goldens
          path: |
            issue12-linux-goldens.tgz
            issue12-linux-goldens.sha256
          if-no-files-found: error
          retention-days: 7

      # Linux evidence for the notification determinism fix: these two suites are
      # exactly the two non-golden failures on main. They run WITHOUT
      # --update-goldens so they must genuinely pass.
      - name: Prove notification suites on Linux
        run: >
          flutter test
          test/features/notifications/application/m7_bigtext_presentation_test.dart
          test/features/notifications/application/snooze_action_dispatch_test.dart
