name: rmplanner
description: Next Transfer RM Planner, an offline-first life-planning app.
publish_to: none
version: 0.1.1+4

environment:
  sdk: 3.12.2

dependencies:
  characters: 1.4.1
  crypto: 3.0.7
  drift: 2.34.2
  drift_flutter: 0.3.1
  flutter:
    sdk: flutter
  flutter_riverpod: 3.3.2
  flutter_svg: 2.2.0
  flutter_secure_storage: 10.3.1
  flutter_timezone: 5.1.0
  geolocator: ^14.0.3
  google_maps_flutter: ^2.18.0
  intl: 0.20.3
  maplibre_gl: ^0.26.2
  go_router: 17.3.0
  local_auth: 3.0.2
  permission_handler: 12.0.3
  timezone: 0.11.1
  url_launcher: 6.3.2
  uuid: 4.5.2
  xml: 7.0.1
  flutter_contacts: ^2.3.1
  flutter_local_notifications: 22.3.0
  workmanager: 0.10.9
  file_selector: 1.1.0
  pointycastle: 4.0.0
  path_provider: 2.1.6

dev_dependencies:
  build_runner: 2.15.1
  drift_dev: 2.34.0
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  plugin_platform_interface: 2.1.8
  sqlite3: 3.5.0
  workmanager_platform_interface: 0.10.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/next_transfer_splash.png
    - assets/icons/goals/
    - assets/icons/filter-svgrepo-com.svg
    - assets/icons/contacts/standard_filters/
    - assets/icons/contacts/social/
    - assets/icons/navigation/
